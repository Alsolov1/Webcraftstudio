<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>WEBCRAFT | Admin Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080a0e;--panel:#11151c;--line:#29313d;--silver:#dce3ed;--muted:#929cab;--accent:#aebdce;--danger:#ff7777}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#1b2635 0%,#0b0e14 45%,#06070a 100%);color:var(--silver);font-family:Inter,Arial,sans-serif}
.login{width:min(100%,430px);padding:38px;border:1px solid var(--line);border-radius:22px;background:rgba(17,21,28,.94);box-shadow:0 24px 90px #0009}
.brand{font-size:13px;letter-spacing:.28em;color:#c8d1dd;text-align:center}h1{font-size:28px;text-align:center;margin:18px 0 8px}.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 30px}
label{display:block;font-size:13px;margin:18px 0 8px;color:#c5ceda}input{width:100%;padding:14px 15px;border-radius:10px;border:1px solid #303a48;background:#090c11;color:#fff;font-size:15px;outline:none}input:focus{border-color:#aab8c9;box-shadow:0 0 0 3px #aab8c91c}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:linear-gradient(110deg,#eef2f7,#9ba9ba);color:#10151d;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
#message{min-height:22px;margin:16px 0 0;text-align:center;color:var(--danger);font-size:13px;line-height:1.6}.back{display:block;text-align:center;margin-top:22px;color:var(--muted);font-size:13px;text-decoration:none}.back:hover{color:#fff}
</style>
</head>
<body>
<main class="login">
  <div class="brand">WEBCRAFT</div>
  <h1>Admin access</h1>
  <p class="sub">Sign in with your authorized administrator account.</p>
  <form id="loginForm">
    <label for="email">Email address</label>
    <input id="email" type="email" autocomplete="username" required placeholder="admin@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="Your password">
    <button id="submitBtn" type="submit">Sign in</button>
  </form>
  <p id="message" role="alert"></p>
  <a class="back" href="../">← Back to website</a>
</main>
<script>
const SUPABASE_URL = "https://dtuocmximdmzwjehzbkn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5_KPLTZQR4YelUYBbYzuvw_CwMpz1uS";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById('loginForm');
const message = document.getElementById('message');
const button = document.getElementById('submitBtn');

async function verifyAdmin(user) {
  const { data, error } = await client
    .from('admin_users')
    .select('user_id')
    .eq('user_id', user.id)
    .maybeSingle();
  if (error) throw error;
  return Boolean(data);
}

(async () => {
  const { data } = await client.auth.getSession();
  if (data.session) {
    try {
      if (await verifyAdmin(data.session.user)) location.replace('./dashboard.html');
      else await client.auth.signOut();
    } catch (e) {
      message.textContent = 'Admin permissions are not configured yet. Please complete the database setup.';
    }
  }
})();

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  message.textContent = '';
  button.disabled = true;
  button.textContent = 'Checking…';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const { data, error } = await client.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const allowed = await verifyAdmin(data.user);
    if (!allowed) {
      await client.auth.signOut();
      throw new Error('This account does not have administrator permissions.');
    }
    location.replace('./dashboard.html');
  } catch (error) {
    message.textContent = error.message || 'Unable to sign in. Please try again.';
  } finally {
    button.disabled = false;
    button.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
